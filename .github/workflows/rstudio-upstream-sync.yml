# .github/workflows/rstudio-upstream-sync.yml
# Weekly (and on demand) re-vendor of R-studioConf docker-deploy/, kubernetes-deploy/
# and the T1 host tools into infra-rstudio/, kubernetes-deploy/rstudio/,
# scripts/infra-rstudio/. Opens (or updates) one PR; the PR runs the same gates as
# any change. Merge only after the rstudio-host lab tier passes (docs/testing.md).
name: rstudio-upstream-sync

on:
  schedule:
    - cron: "0 5 * * 1" # Monday 05:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "R-studioConf ref to vendor (branch, tag or commit)"
        required: false
        default: "main"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rstudio-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Re-vendor from R-studioConf
        id: sync
        run: |
          set -euo pipefail
          old="$(jq -r .upstream.commit infra-rstudio/UPSTREAM.lock)"
          scripts/infra-rstudio/sync_rstudioconf.sh --update --ref "${{ inputs.ref || 'main' }}" | tee "$RUNNER_TEMP/sync.log"
          new="$(jq -r .upstream.commit infra-rstudio/UPSTREAM.lock)"
          echo "old=${old:0:12}" >> "$GITHUB_OUTPUT"
          echo "new=${new:0:12}" >> "$GITHUB_OUTPUT"

      - name: Gates on the vendored result
        run: |
          set -euo pipefail
          scripts/infra-rstudio/sync_rstudioconf.sh --check
          .ai/validate.sh --ci
          cd infra-rstudio
          for backend in sssd samba; do
            docker compose --env-file .env.sandbox --profile "$backend" --profile portal --profile oidc config -q
          done

      - name: Open or update the sync PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/rstudio-upstream-sync
          delete-branch: true
          commit-message: "chore(rstudio): sync R-studioConf ${{ steps.sync.outputs.old }}..${{ steps.sync.outputs.new }}"
          title: "chore(rstudio): sync R-studioConf @ ${{ steps.sync.outputs.new }}"
          body-path: ${{ runner.temp }}/sync.log
          labels: rstudio, dependencies
